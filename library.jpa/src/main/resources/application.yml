spring:
  application:
    name: library.jpa
  datasource:
    url: jdbc:postgresql://localhost:5432/library
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false # Mostra no log o sql.
    hibernate: # Apenas para estudo, não é recomendado e muitas vezes nem possível.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
